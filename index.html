<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Lingua — Travel voice translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="phrase-controls.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="Lingua home"><span class="brand-mark">⌁</span>lingua</a>
      </header>
      <main id="top">
        <section class="intro"><div><h1>Travel voice<br /><em>translator.</em></h1></div></section>
        <section class="workspace" id="translate">
          <div class="translator-card">
            <div class="translator-head"><h2>Translate</h2></div>
            <div class="language-card" aria-label="Translation language"><div class="language-select source"><span class="flag">🇺🇸</span><div><small>YOU SPEAK</small><strong id="sourceName">English</strong></div></div><button class="swap" id="swapLanguages" aria-label="Reverse translation direction"><span>⇄</span><small>Reverse</small></button><button class="language-select target" id="openLanguages"><span class="flag" id="targetFlag">🇯🇵</span><div><small>THEY HEAR</small><strong id="targetName">Japanese</strong></div><span class="chevron">⌄</span></button></div>
            <p class="direction-help"><span class="pulse"></span><span id="directionLabel">English → Japanese</span></p>
            <div class="conversation-grid"><section class="speech-panel input-panel"><div class="panel-heading"><p class="input-label" id="inputLabel">SAY SOMETHING</p><button class="clear-text" id="clearTranscript">Clear</button></div><p class="transcript empty" id="transcript">Tap the microphone and speak</p></section><section class="speech-panel output-panel"><div class="panel-heading"><p class="input-label" id="outputLabel">JAPANESE</p></div><p class="translation" id="translation">二人です。</p><p class="romanization" id="romanization">Futari desu.</p><button class="play-translation" id="speakTranslation"><span>▶</span> Play</button></section></div>
            <div class="record-actions"><button class="type-action" id="typeButton"><span>⌨</span> Type</button><div class="record-wrap"><button class="mic" id="recordButton" aria-label="Start recording"><span class="mic-icon">●</span></button><p id="micCaption">Tap to speak</p></div></div>
          </div>
          <aside class="trip-card"><p class="eyebrow">DESTINATION</p><div class="destination-list"><button class="quick-destination selected" data-quick-lang="Japanese"><span>🇯🇵</span><div><strong>Japan</strong><small>Japanese · 日本語</small></div><b>Selected</b></button><button class="quick-destination" data-quick-lang="Mandarin"><span>🇨🇳</span><div><strong>Shanghai</strong><small>Mandarin · 普通话</small></div><b>Select</b></button><button class="quick-destination" data-quick-lang="Cantonese"><span>🇭🇰</span><div><strong>Hong Kong</strong><small>Cantonese · 廣東話</small></div><b>Select</b></button></div></aside>
        </section>
        <section class="phrase-section" id="phrasebook"><div class="section-heading"><h2 id="phraseTitle">Dining in Japan</h2><button id="seeAll">All phrases <span>→</span></button></div><div class="chips" id="categoryChips"></div><div class="phrase-list" id="phraseList"></div></section>
      </main>
    </div>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <aside class="language-sheet" id="languageSheet" aria-hidden="true"><div class="sheet-heading"><h2>Choose language</h2><button id="closeSheet" aria-label="Close language picker">×</button></div><button class="destination selected" data-lang="Japanese"><span>🇯🇵</span><div><strong>Japan</strong><small>Japanese · 日本語</small></div><b>✓</b></button><button class="destination" data-lang="Mandarin"><span>🇨🇳</span><div><strong>Shanghai</strong><small>Mandarin · 普通话</small></div><b>✓</b></button><button class="destination" data-lang="Cantonese"><span>🇭🇰</span><div><strong>Hong Kong</strong><small>Cantonese · 廣東話</small></div><b>✓</b></button></aside>
    <div class="type-modal" id="typeModal" aria-hidden="true"><div class="type-box"><button class="modal-close" id="closeType" aria-label="Close typing window">×</button><h2>Type a message</h2><textarea id="typeInput" placeholder="e.g. A table for two, please."></textarea><button id="translateTyped">Translate <span>→</span></button></div></div>
    <script src="app.js"></script>
  </body>
</html>
